        // AUTH HANDLERS
        function handleClientLogin(e) {
            e.preventDefault();
            const phone = document.getElementById('login-phone').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            const users = JSON.parse(localStorage.getItem('trcp_users')) || [];
            const user = users.find(u => u.phone === phone && u.password === pass);

            if (user) {
                if (user.banned) {
                    showToast("Your account is banned. Contact helpline.", "error");
                    return;
                }
                currentUser = user;
                localStorage.setItem('trcp_current_user', JSON.stringify(currentUser));
                showToast("Logged in successfully!", "success");
                navigate('home');
            } else {
                showToast("Invalid Phone Number or PIN Password.", "error");
            }
        }

        function handleClientRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            const pass = document.getElementById('reg-pass').value.trim();

            if (pass.length !== 4) {
                showToast("PIN Password must be exactly 4 digits.", "error");
                return;
            }

            const users = JSON.parse(localStorage.getItem('trcp_users')) || [];
            if (users.some(u => u.phone === phone)) {
                showToast("Phone number already registered. Please login.", "error");
                return;
            }

            const newUser = { name, phone, password: pass, banned: false, createdAt: new Date().toISOString() };
            users.push(newUser);
            localStorage.setItem('trcp_users', JSON.stringify(users));

            currentUser = newUser;
            localStorage.setItem('trcp_current_user', JSON.stringify(currentUser));
            showToast("Account registered successfully!", "success");
            navigate('home');
        }

        function generateAutoMatrix() {
            const profiles = JSON.parse(localStorage.getItem('trcp_profiles')) || [];
            const locations = JSON.parse(localStorage.getItem('trcp_locations')) || {};
            const matrix = {};

            let subAreasList = [];
            Object.keys(locations).forEach(mArea => {
                locations[mArea].forEach(city => {
                    city.subAreas.forEach(sa => subAreasList.push(sa.name));
                });
            });

            const mediumProfiles = profiles.filter(p => p.category === 'Medium').map(p => p.code);
            const premiumProfiles = profiles.filter(p => p.category === 'Premium').map(p => p.code);
            const specialProfiles = profiles.filter(p => p.category === 'New Special' || p.category === 'Special').map(p => p.code);

            // Matrix generation with multi-location AND multi-date restriction per sub-area
            for (let dIdx = 0; dIdx < 10; dIdx++) {
                let d = new Date();
                d.setDate(d.getDate() + dIdx);
                let dateStr = d.toISOString().split('T')[0];

                let usedOnDate = new Set();

                subAreasList.forEach((saName, saIdx) => {
                    const key = `${dateStr}_${saName}`;
                    let assigned = [];

                    // Pick from medium, premium, special without violating rules
                    const pickCodes = (pool, count) => {
                        let poolCopy = [...pool];
                        let selected = [];
                        let attempt = 0;
                        while (selected.length < count && poolCopy.length > 0 && attempt < 50) {
                            attempt++;
                            let idx = (dIdx + saIdx + selected.length + attempt) % poolCopy.length;
                            let candidate = poolCopy[idx];

                            // Rule 1: Cannot be used on same date elsewhere
                            if (usedOnDate.has(candidate)) {
                                poolCopy.splice(idx, 1);
                                continue;
                            }

                            // Rule 2: Cannot be repeated in same subarea across dates
                            let repeatedInSubarea = false;
                            for (let prevD = 0; prevD < dIdx; prevD++) {
                                let prevDate = new Date();
                                prevDate.setDate(prevDate.getDate() + prevD);
                                let prevKey = `${prevDate.toISOString().split('T')[0]}_${saName}`;
                                if ((matrix[prevKey] || []).includes(candidate)) {
                                    repeatedInSubarea = true;
                                    break;
                                }
                            }

                            if (!repeatedInSubarea || pool.length < subAreasList.length) {
                                selected.push(candidate);
                                usedOnDate.add(candidate);
                                poolCopy.splice(idx, 1);
                            }
                        }
                        return selected;
                    };

                    const mPicked = pickCodes(mediumProfiles, 3);
                    const pPicked = pickCodes(premiumProfiles, 3);
                    const sPicked = pickCodes(specialProfiles, 2);

                    matrix[key] = [...mPicked, ...pPicked, ...sPicked];
                });
            }

            localStorage.setItem('trcp_matrix', JSON.stringify(matrix));
            showToast("10-Day Rotation Schedule Matrix generated!", "success");
            renderCurrentView();
        }

        function saveMatrixCell(dateStr, subAreaName) {
            const matrix = JSON.parse(localStorage.getItem('trcp_matrix')) || {};
            const checkboxes = document.querySelectorAll('.matrix-code-checkbox:checked');
            const selectedCodes = Array.from(checkboxes).map(cb => cb.value);

            // Validate Rule 1: Same date overlap check
            let conflictFound = false;
            Object.keys(matrix).forEach(key => {
                if (key.startsWith(dateStr) && !key.endsWith(`_${subAreaName}`)) {
                    const existingCodes = matrix[key] || [];
                    selectedCodes.forEach(code => {
                        if (existingCodes.includes(code)) {
                            conflictFound = true;
                        }
                    });
                }
            });

            if (conflictFound) {
                showToast("Conflict Warning: Code already assigned to another location on this date!", "error");
                return;
            }

            matrix[`${dateStr}_${subAreaName}`] = selectedCodes;
            localStorage.setItem('trcp_matrix', JSON.stringify(matrix));
            closeModal();
            showToast("Matrix updated successfully.", "success");
            renderCurrentView();
        }

                    <form onsubmit="handleSaveProfile(event, ${id || 'null'})" class="space-y-4">
                        <div>
                            <label class="block text-xs text-zinc-400 mb-1">Name</label>
                            <input type="text" id="prof-name" value="${p.name}" required class="w-full px-4 py-3 rounded-xl bg-obsidian border border-zinc-800 text-white text-xs">
                        </div>
                        <div>
                            <label class="block text-xs text-zinc-400 mb-1">Profile Code Number</label>
                            <input type="text" id="prof-code" value="${p.code}" required class="w-full px-4 py-3 rounded-xl bg-obsidian border border-zinc-800 text-white text-xs">
                        </div>
                        <div>
                            <label class="block text-xs text-zinc-400 mb-1">Category</label>
                            <select id="prof-cat" class="w-full px-4 py-3 rounded-xl bg-obsidian border border-zinc-800 text-white text-xs">
                                <option value="Medium" ${p.category === 'Medium' ? 'selected' : ''}>Medium</option>
                                <option value="Premium" ${p.category === 'Premium' ? 'selected' : ''}>Premium</option>
                                <option value="New Special" ${p.category === 'New Special' ? 'selected' : ''}>New Special</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-zinc-400 mb-1">Photos (Supports >3GB local gallery files)</label>
                            <input type="file" id="prof-photos" multiple accept="image/*" class="w-full px-4 py-2.5 rounded-xl bg-obsidian border border-zinc-800 text-white text-xs">
                        </div>
                        <div>
                            <label class="block text-xs text-zinc-400 mb-1">Video Upload (Supports >3GB local gallery files)</label>
                            <input type="file" id="prof-video" accept="video/*" class="w-full px-4 py-2.5 rounded-xl bg-obsidian border border-zinc-800 text-white text-xs">
                        </div>
                        <div>
                            <label class="block text-xs text-zinc-400 mb-1">Custom Rate Override (Optional BDT)</label>
                            <input type="number" id="prof-rate" value="${p.customRate || ''}" placeholder="Default Rate Rules Apply If Empty" class="w-full px-4 py-3 rounded-xl bg-obsidian border border-zinc-800 text-white text-xs">
                        </div>
                        <button type="submit" class="w-full py-3.5 rounded-xl gold-gradient-bg text-obsidian font-bold text-xs uppercase tracking-wider">
                            Save Profile
                        </button>
                    </form>
                </div>
            `);
        }

        function handleSaveProfile(e, id) {
            e.preventDefault();
            const name = document.getElementById('prof-name').value.trim();
            const code = document.getElementById('prof-code').value.trim();
            const category = document.getElementById('prof-cat').value;
            const rateVal = document.getElementById('prof-rate').value;

            const photoFiles = document.getElementById('prof-photos').files;
            const photos = [];
            if (photoFiles.length > 0) {
                for (let i = 0; i < Math.min(photoFiles.length, 5); i++) {
                    photos.push(URL.createObjectURL(photoFiles[i]));
                }
            }

            const videoFile = document.getElementById('prof-video').files[0];
            const videoUrl = videoFile ? URL.createObjectURL(videoFile) : "";

            const profiles = JSON.parse(localStorage.getItem('trcp_profiles')) || [];

            if (id) {
                const p = profiles.find(x => x.id === id);
                if (p) {
                    p.name = name;
                    p.code = code;
                    p.category = category;
                    if (photos.length > 0) p.photos = photos;
                    if (videoUrl) p.video = videoUrl;
                    p.customRate = rateVal ? parseFloat(rateVal) : null;
                }
            } else {
                profiles.push({
                    id: Date.now(),
                    code,
                    name,
                    category,
                    photos: photos.length > 0 ? photos : ["https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80"],
                    video: videoUrl,
                    status: 'available',
                    customRate: rateVal ? parseFloat(rateVal) : null
                });
            }

            localStorage.setItem('trcp_profiles', JSON.stringify(profiles));
            closeModal();
            showToast("Profile saved successfully.", "success");
            renderCurrentView();
        }

        // GALLERY MODAL SLIDER WITH VIDEO SUPPORT
        let currentSlideIndex = 0;
        function openProfileGalleryModal(id) {
            const profiles = JSON.parse(localStorage.getItem('trcp_profiles')) || [];
            const p = profiles.find(x => x.id === id);
            if (!p) return;

            currentSlideIndex = 0;
            const mediaItems = [...p.photos];
            if (p.video) mediaItems.push({ type: 'video', url: p.video });

            showModal(`
                <div class="glass-card p-6 rounded-3xl max-w-lg w-full space-y-4 border gold-border animate-fade-in relative">
                    <button onclick="closeModal()" class="absolute top-4 right-4 z-20 text-zinc-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
                    <div class="text-center space-y-1">
                        <h3 class="font-serif text-xl font-bold text-white">${p.name} (#${p.code})</h3>
                        <div class="text-xs text-gold">${p.category} Profile Media</div>
                    </div>

                    <div class="relative aspect-[3/4] rounded-2xl overflow-hidden bg-obsidian border border-zinc-800" id="gallery-viewport">
                        ${renderSlideMedia(mediaItems[0])}
                    </div>

                    ${mediaItems.length > 1 ? `
                        <div class="flex justify-between items-center pt-2">
                            <button onclick="prevSlide(${id})" class="px-4 py-2 rounded-xl bg-zinc-800 text-white text-xs font-bold"><i class="fa-solid fa-chevron-left"></i> Prev</button>
                            <span class="text-xs text-zinc-400" id="slide-counter">1 / ${mediaItems.length}</span>
                            <button onclick="nextSlide(${id})" class="px-4 py-2 rounded-xl bg-zinc-800 text-white text-xs font-bold">Next <i class="fa-solid fa-chevron-right"></i></button>
                        </div>
                    ` : ''}
                </div>
            `);
        }

        function renderSlideMedia(item) {
            if (typeof item === 'object' && item.type === 'video') {
                return `<video src="${item.url}" controls autoplay class="w-full h-full object-cover"></video>`;
            } else {
                return `<img src="${item}" class="w-full h-full object-cover">`;
            }
        }

        function nextSlide(profileId) {
            const profiles = JSON.parse(localStorage.getItem('trcp_profiles')) || [];
            const p = profiles.find(x => x.id === profileId);
            const mediaItems = [...p.photos];
            if (p.video) mediaItems.push({ type: 'video', url: p.video });

            currentSlideIndex = (currentSlideIndex + 1) % mediaItems.length;
            document.getElementById('gallery-viewport').innerHTML = renderSlideMedia(mediaItems[currentSlideIndex]);
            document.getElementById('slide-counter').innerText = `${currentSlideIndex + 1} / ${mediaItems.length}`;
        }

        function prevSlide(profileId) {
            const profiles = JSON.parse(localStorage.getItem('trcp_profiles')) || [];
            const p = profiles.find(x => x.id === profileId);
            const mediaItems = [...p.photos];
            if (p.video) mediaItems.push({ type: 'video', url: p.video });

            currentSlideIndex = (currentSlideIndex - 1 + mediaItems.length) % mediaItems.length;
            document.getElementById('gallery-viewport').innerHTML = renderSlideMedia(mediaItems[currentSlideIndex]);
            document.getElementById('slide-counter').innerText = `${currentSlideIndex + 1} / ${mediaItems.length}`;
        }

        // GLOBAL UTILITIES
        function showModal(html) {
            const wrapper = document.getElementById('modal-wrapper');
            wrapper.innerHTML = html;
            wrapper.classList.remove('hidden');
        }

        function closeModal() {
            const wrapper = document.getElementById('modal-wrapper');
            wrapper.innerHTML = '';
            wrapper.classList.add('hidden');
        }

        function showToast(msg, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-6 left-6 z-50 px-6 py-3 rounded-2xl text-xs font-bold shadow-2xl transition-all duration-300 animate-bounce ${type === 'success' ? 'bg-emerald-950 text-emerald-300 border border-emerald-800' : 'bg-red-950 text-red-300 border border-red-800'}`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-triangle-exclamation'} mr-2"></i> ${msg}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3200);
        }

        function toggleHelpline() {
            document.getElementById('helpline-dropdown').classList.toggle('hidden');
        }

        // APPLICATION INIT
        window.onload = function() {
            renderCurrentView();
        };
    </script>
</body>
</html>
